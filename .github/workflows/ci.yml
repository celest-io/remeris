name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Installs Go, golangci-lint, hk, jactionlint and the other tools from mise.toml.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
      - run: mise run ci

  # Compile and vet only: the Windows and macOS code paths are not run in CI.
  cross-os:
    name: vet (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Installs Go from mise.toml.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
      - run: mise exec -- go vet ./...
        env:
          GOOS: ${{ matrix.goos }}

  # Renovate bumps the versions in mise.toml but cannot regenerate mise.lock. A stale lockfile makes `mise install` fail in
  # every job with an unclear error, so say what to do. Read-only: it runs `mise lock` and fails on a diff.
  mise-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Installs mise only: no tool is needed to resolve the lockfile.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          # The lockfile format changes between mise releases (2026.10.21 started to record repository IDs), so this check runs
          # the mise version the lockfile was written with. Change it together with `mise lock`, see docs/maintaining.md.
          version: 2026.10.21
          install: false
          cache: false
      - name: Check that mise.lock matches mise.toml
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise lock --platform linux-x64,linux-arm64,macos-arm64
          if ! git diff --exit-code -- mise.lock; then
            echo "::error file=mise.lock::mise.lock is out of date. Run 'mise lock --platform linux-x64,linux-arm64,macos-arm64' and commit mise.lock (see CLAUDE.md)."
            exit 1
          fi

  # The documentation website (website/, built with Blume from docs/ and website/docs/). It runs on every push and pull request on
  # purpose: a path-filtered job never reports when the filter does not match, so it could not be a required check. The npm cache
  # keeps it cheap. No deploy step: Cloudflare builds and publishes the site from Git (see website/README.md).
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Installs only Node from mise.toml; the Go tools are not needed here.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          install_args: node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('website/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: mise run website-build
      # Internal links, anchors and assets only: external links are not checked, they would make CI flaky.
      - run: mise run website-validate
