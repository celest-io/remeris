name: Push artifact
# remeris's `release` workflow creates the GitHub release and the `v*` tag. That tag push lands here:
# build the archives for every platform, sign and attest them, and attach them to the release that was
# already created. The build job holds no write permission; the publish job never runs repository code.
# Then a signed packslip bundle (packslip.sigstore.json) is made for mise's packslip backend: one job signs
# (it cannot write to the release), another one uploads the bundle (it cannot sign).
#
# Run by hand (workflow_dispatch, from main only), it skips the build and publish jobs and only adds the
# packslip bundle to an existing release, after checking the release's assets against its signed SHA256SUMS.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to add the packslip bundle to (v + SemVer, for example v0.0.1)"
        required: true
        type: string
# One run per tag: a dispatch for a tag waits for the tag-push run of the same tag, and the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    # Tag pushes only: a dispatch never builds, it signs what the release already has.
    if: github.event_name == 'push'
    # Not ubuntu-latest: the archives are reproducible only for the same tar, gzip, zip and Go, and "latest" moves
    # to a new image (and new tool versions) without a change of this file. Move it with a reviewed change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
      files: ${{ steps.sums.outputs.files }}
    steps:
      # The full history, to check that the tag is on main.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit ${GITHUB_SHA} is not on main: refusing to build a release from it" >&2
            exit 1
          fi
      - name: Install Go
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          cache: false
          install_args: go
      - name: Verify the tag matches VERSION
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GIT_TAG" != "v${version}" ]; then
            echo "Git tag '${GIT_TAG}' does not match VERSION 'v${version}'" >&2
            exit 1
          fi
      - name: Build archives
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: mise run dist -- "$GIT_TAG"
      # What the publish job must find again: the hash of SHA256SUMS and the archives it lists.
      - name: Record the checksums
        id: sums
        run: |
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "files=$(awk '{print $2}' dist/SHA256SUMS | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # gh release upload
      id-token: write  # keyless signing and attestation (GitHub OIDC)
      attestations: write  # build provenance attestations
    env:
      SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
      FILES: ${{ needs.build.outputs.files }}
    steps:
      # No checkout: this job runs no file of the repository.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      # The artifact must be what the build job recorded: SHA256SUMS has the recorded hash, lists exactly
      # the recorded archives, and every archive matches it.
      - name: Verify the build output
        run: |
          set -euo pipefail
          cd dist
          echo "${SUMS_SHA256}  SHA256SUMS" | sha256sum --check -
          read -r -a files <<<"$FILES"
          diff <(printf '%s\n' "${files[@]}" | LC_ALL=C sort) <(awk '{print $2}' SHA256SUMS | LC_ALL=C sort)
          sha256sum --check SHA256SUMS
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          read -r -a files <<<"$FILES"
          cd dist
          gh release upload "$GIT_TAG" "${files[@]}" SHA256SUMS SHA256SUMS.sigstore.json

  # Dispatch only: turn the tag input into a checked tag and commit. It applies to the dispatch path the
  # checks that the build job applies to the tag path (the commit is on main, the tag matches VERSION).
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # The workflow file that signs is the one of the ref the run was started from. This check is inside that file,
      # so it only stops mistakes: someone with write access can push a branch with a modified copy and run it there
      # (see "Who can run push-artifact.yaml by hand" in docs/releasing.md).
      - name: Check the workflow ref and the tag input
        id: tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "Run this workflow from main, not from ${REF}" >&2
            exit 1
          fi
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$INPUT_TAG" =~ $semver ]]; then
            echo "The tag input must be v followed by a SemVer version (for example v0.0.1)" >&2
            exit 1
          fi
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
      # The full history, to check that the tag is on main. The tag is checked out as a tag, never as a branch.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit is on main and the tag matches VERSION
        id: commit
        env:
          GIT_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Commit ${commit} is not on main: refusing to sign a release from it" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GIT_TAG" != "v${version}" ]; then
            echo "Git tag '${GIT_TAG}' does not match VERSION 'v${version}'" >&2
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

  # Signs the packslip release bundle. It cannot change the release (contents: read), and the signing action
  # never sees a write token. The archives are downloaded and checked here, then signed from disk, so what is
  # signed is what was checked. attest: link, not true: the publish job attested the archives when it built
  # them, and an attestation made here would describe this run instead of the build of the tag. That also
  # makes attestations: write unnecessary.
  packslip:
    needs: [publish, resolve]
    # !cancelled(), not success(): publish is skipped on a dispatch and resolve on a tag push, which would
    # skip this job. The explicit result checks keep it from running after a failed job.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # download the release assets
      id-token: write  # keyless signing (GitHub OIDC)
    env:
      TAG: ${{ needs.resolve.outputs.tag || github.ref_name }}
      COMMIT: ${{ needs.resolve.outputs.commit || github.sha }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      bundle-sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      # No checkout: this job runs no file of the repository.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # First SHA256SUMS and its signature, and nothing else: the list of files to sign comes from the verified list,
      # not from a pattern, so it does not depend on the archive formats.
      - name: Verify SHA256SUMS of the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir dist --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
          # Signed by the push-artifact workflow of this repository, at this tag, for a push of this commit.
          cosign verify-blob dist/SHA256SUMS \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/push-artifact.yaml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$COMMIT" \
            --certificate-github-workflow-trigger push
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      # Exactly the files that SHA256SUMS lists, with names that are plain file names of this project.
      - name: Download and verify the archives of the release
        id: archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          name_re='^remeris_v[0-9A-Za-z.+-]+_(linux|darwin|windows)_(amd64|arm64)\.(tar\.gz|tar\.xz|zip)$'
          mapfile -t listed < <(awk '{print $2}' SHA256SUMS)
          if [ "${#listed[@]}" -eq 0 ]; then
            echo "SHA256SUMS lists no file" >&2
            exit 1
          fi
          pattern_args=()
          for name in "${listed[@]}"; do
            if [[ ! "$name" =~ $name_re ]]; then
              echo "SHA256SUMS lists an unexpected file name: ${name}" >&2
              exit 1
            fi
            pattern_args+=(--pattern "$name")
          done
          gh release download "$TAG" --dir . "${pattern_args[@]}"
          sha256sum --check SHA256SUMS
          # The directory holds the listed archives and nothing else (a duplicate in the list fails here too).
          shopt -s nullglob
          present=(remeris_*)
          diff <(printf '%s\n' "${present[@]}" | LC_ALL=C sort) <(printf '%s\n' "${listed[@]}" | LC_ALL=C sort)
          # Every archive was built and attested by the workflow of this tag, from this commit.
          for archive in "${listed[@]}"; do
            gh attestation verify "$archive" --repo "$REPO" \
              --cert-identity "https://github.com/${REPO}/.github/workflows/push-artifact.yaml@refs/tags/${TAG}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/${TAG}" --source-digest "$COMMIT"
          done
          # The input of the action: whitespace separated paths (the names have no whitespace, checked above).
          echo "artifacts=$(printf 'dist/%s ' "${listed[@]}")" >> "$GITHUB_OUTPUT"
      - name: Sign the packslip
        id: packslip
        uses: jdx/packslip@3a4afb16b29d3ac639fcd35cbe99124184f71859  # v1.11.1
        with:
          artifacts: ${{ steps.archives.outputs.artifacts }}
          bin: remeris
          tag: ${{ env.TAG }}
          commit: ${{ env.COMMIT }}
          attest: link
          upload: false
      # The upload job checks the artifact it downloads against this hash.
      - name: Record the hash of the bundle
        id: bundle
        env:
          BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: echo "sha256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Keep the bundle for the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error
          retention-days: 7

  # Attaches the bundle to the release. It holds the write permission and signs nothing.
  publish-packslip:
    needs: packslip
    # Not the implicit success(): it also looks at the jobs further up the needs chain, and one of them is always
    # skipped (resolve on a tag push, build and publish on a dispatch), which would skip this job every time.
    if: ${{ !cancelled() && needs.packslip.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # gh release upload
    env:
      TAG: ${{ needs.packslip.outputs.tag }}
      BUNDLE_SHA256: ${{ needs.packslip.outputs.bundle-sha256 }}
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: packslip-bundle
          path: packslip
      - name: Upload the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${BUNDLE_SHA256}  packslip/packslip.sigstore.json" | sha256sum --check -
          gh release upload "$TAG" packslip/packslip.sigstore.json --clobber
