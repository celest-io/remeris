name: Push artifact
# remeris's `release` workflow creates the GitHub release and the `v*` tag. That tag push lands here:
# build the archives for every platform, sign and attest them, and attach them to the release that was
# already created. The build job holds no write permission; the publish job never runs repository code.
on:
  push:
    tags:
      - "v*.*.*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          cache: false
          install_args: go
      - name: Verify the tag matches VERSION
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GIT_TAG" != "v${version}" ]; then
            echo "Git tag '${GIT_TAG}' does not match VERSION 'v${version}'" >&2
            exit 1
          fi
      - name: Build archives
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: mise run dist -- "$GIT_TAG"
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # gh release upload
      id-token: write  # keyless signing and attestation (GitHub OIDC)
      attestations: write  # build provenance attestations
    steps:
      # Only for mise.toml and mise.lock: cosign is a pinned mise tool.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
        with:
          cache: false
          install_args: cosign
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify the checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TAG: ${{ github.ref_name }}
        run: gh release upload "$GIT_TAG" dist/*
