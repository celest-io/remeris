min_version = "2026.10.8"
[settings]
lockfile = true

[tools]
go = "1.27.1"
node = "24.22.1"                                     # LTS; builds the documentation website in website/ (Blume needs >= 22.19)
golangci-lint = "2.14.0"
"github:owenlamont/ryl" = "0.26.1"                   # lints and formats YAML (Rust yamllint)
hk = { version = "2.8.1", workflow = "release.yml" } # runner that orchestrates the hooks in hk.pkl
rumdl = "0.3.0"                                      # lints Markdown
shellcheck = "0.11.0"                                # jactionlint runs it on the run: scripts of the workflows
jactionlint = "2.3.0"                                # lints GitHub Actions workflows (replaces zizmor)
cosign = "3.1.4"                                     # mise verifies the provenance of tools in mise.lock with it
